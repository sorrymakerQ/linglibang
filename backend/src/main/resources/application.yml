# ==========================================
# 邻里帮 - 社区互助平台 配置文件
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: linlibang

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/linlibang?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 密码必须通过环境变量 MYSQL_PASSWORD 设置，未配置则启动失败（fail-fast，禁止硬编码）
    password: ${MYSQL_PASSWORD}

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 3000ms
    connect-timeout: 3000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        max-wait: 1000ms

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 3000ms
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: manual
        prefetch: 1

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis 配置
mybatis:
  configuration:
    # 数据库字段下划线转驼峰：help_count → helpCount
    map-underscore-to-camel-case: true
  # 实体类所在包，用于类型别名
  type-aliases-package: com.linlibang.entity

# 日志配置
logging:


# Sa-Token 认证配置
sa-token:
  # JWT 密钥（生产环境通过环境变量 SA_TOKEN_JWT_SECRET_KEY 覆盖）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}
  # Token 有效期：7天
  timeout: 604800
  # 临时有效期（用户持续操作自动续期）：3天
  active-timeout: 259200
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # Token 风格：tik（随机token），jwt（JWT风格）
  token-style: tik
  # 从请求头读取 Token 的名称为 satoken
  token-name: satoken

# 邻里帮自定义配置
linlibang:
  # 默认坐标（前端定位失败/未提供坐标时的兜底值：北京·天安门）
  default-location:
    lng: 116.397428
    lat: 39.90923
    address: 北京市东城区天安门广场

# ==========================================
# 阿里云 OSS 配置（敏感信息请通过环境变量设置）
# ==========================================
# 环境变量：
#   ALIYUN_OSS_ACCESS_KEY_ID     - 阿里云 AccessKey ID
#   ALIYUN_OSS_ACCESS_KEY_SECRET - 阿里云 AccessKey Secret
#   MYSQL_PASSWORD               - 数据库密码
#   JWT_SECRET                   - JWT 签名密钥
# 请前往 https://oss.console.aliyun.com 创建 Bucket 并获取以下信息
aliyun:
  oss:
    # 地域节点（Endpoint），例如：oss-cn-hangzhou.aliyuncs.com
    endpoint: oss-cn-beijing.aliyuncs.com
    # 阿里云 AccessKey ID（通过环境变量 ALIYUN_OSS_ACCESS_KEY_ID 设置，请勿在此填写真实值）
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    # 阿里云 AccessKey Secret（通过环境变量 ALIYUN_OSS_ACCESS_KEY_SECRET 设置，请勿在此填写真实值）
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    # Bucket 名称
    bucket-name: linglibang
    # 访问域名（用于拼接完整URL），例如：https://linlibang.oss-cn-hangzhou.aliyuncs.com
    base-url: https://linglibang.oss-cn-beijing.aliyuncs.com
    # 上传文件大小限制（MB）
    max-size: 10
